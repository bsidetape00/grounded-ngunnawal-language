<title>Yarn Ngunnawal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#B4532A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: single-column phone app, sticky top bar, fixed bottom tab bar. Palette taken from the YARN mockup design system. */
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --ink:#2A2724; --muted:#6F675F; --line:#E6DFD6;
  --ochre:#B4532A; --ochre-soft:#F3E2D8; --gold:#D99A2B; --gold-soft:#F7EBD2;
  --sage:#6F8A5E; --sage-soft:#E4EBDD; --warn:#9A6A12; --warn-soft:#F6EAD0;
  --plum:#8A4E5E; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1A18; --card:#262320; --ink:#F1ECE6; --muted:#ABA196; --line:#3A3530;
  --ochre:#E07A4C; --ochre-soft:#3D2A21; --gold:#E8B451; --gold-soft:#3A3122;
  --sage:#9DB58A; --sage-soft:#283224; --warn:#E8B451; --warn-soft:#3A3122;
  --plum:#C98A9A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A18; --card:#262320; --ink:#F1ECE6; --muted:#ABA196; --line:#3A3530;
  --ochre:#E07A4C; --ochre-soft:#3D2A21; --gold:#E8B451; --gold-soft:#3A3122;
  --sage:#9DB58A; --sage-soft:#283224; --warn:#E8B451; --warn-soft:#3A3122;
  --plum:#C98A9A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
header.top h1{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:22px;height:22px}
.brand{padding-block:8px 18px;text-align:center}
.brand .yarn{font-size:44px;font-weight:800;letter-spacing:.04em;line-height:1}
.brand .lang{font-size:21px;font-weight:500;color:var(--ochre);margin-top:4px}
.brand .tag{color:var(--muted);font-size:13px;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px}
.row>.grow{flex:1;min-width:0}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.badge svg{width:24px;height:24px}
.b-gold{background:var(--gold)} .b-ochre{background:var(--ochre)} .b-sage{background:var(--sage)} .b-plum{background:var(--plum)}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.word{font-size:24px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.gloss{color:var(--muted);overflow-wrap:anywhere}
.small{font-size:13px;color:var(--muted)}
.link{color:var(--ochre);font-weight:600;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-ok{background:var(--sage-soft);color:var(--sage)}
.st-chk{background:var(--warn-soft);color:var(--warn)}
.st-b,.st-s{background:var(--ochre-soft);color:var(--ochre)}
.st-cv{background:var(--sage);color:var(--card)}
.st-x{background:var(--line);color:var(--muted);text-decoration:line-through}
.heart{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ochre)}
.heart svg{width:22px;height:22px}
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--sage);border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600}
.btn-primary{background:var(--ochre);color:#fff}
.btn-sage{background:var(--sage);color:#fff}
.btn-ghost{border:1.5px solid var(--ochre);color:var(--ochre)}
.btn-block{width:100%}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:#fff}
h2.sec{font-size:15px;font-weight:700;margin:10px 0 0;display:flex;justify-content:space-between;align-items:baseline}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .w{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.item .g{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ochre)}
/* detail sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.src{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.src h3{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
/* lesson */
.qword{font-size:34px;font-weight:800;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.qprompt{text-align:center;color:var(--muted);font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;min-height:76px;font-weight:600;text-align:center;overflow-wrap:anywhere}
.opt.right{border-color:var(--sage);background:var(--sage-soft);color:var(--sage)}
.opt.wrong{border-color:var(--ochre);background:var(--ochre-soft);color:var(--ochre)}
.opt:disabled{cursor:default}
.lessongrid{display:grid;grid-template-columns:1fr;gap:10px}
.lesson{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;overflow-wrap:anywhere}
.tbl td:nth-child(2){color:var(--muted)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.note b{color:var(--warn)}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50}
.prose p{margin:0 0 10px} .prose p:last-child{margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<div class="wrap" id="app">
  <header class="top"><h1 id="ttl">Home</h1><span class="count" id="hdrInfo"></span></header>
  <main id="view"><div class="empty">Loading word lists&hellip;</div></main>
</div>
<nav class="tabs" aria-label="Main"><div class="in" id="tabs"></div></nav>

<script>
(()=>{
const I={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>',
 dict:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/><circle cx="11.5" cy="9.5" r="3"/><path d="m13.6 11.6 2.4 2.4"/></svg>',
 learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>',
 saved:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-8-4.6-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 3c0 5.9-8 10.5-8 10.5z"/></svg>',
 heartFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-8-4.6-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 3c0 5.9-8 10.5-8 10.5z"/></svg>',
 about:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5z"/><path d="M12 6v13"/></svg>',
 quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg>',
 tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-7"/><path d="M12 15c-4 0-7-2.5-7-6a7 7 0 0 1 14 0c0 3.5-3 6-7 6z"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
const TABS=[['home','Home',I.home],['dictionary','Dictionary',I.dict],['learn','Learn',I.learn],['saved','Saved',I.saved],['about','About',I.about]];
const ST={cv:['Checked by Cheyne','st-cv'],ok:['Both sources agree','st-ok'],chk:['Sources differ','st-chk'],b:['Baird 2022 only','st-b'],s:['Sketch grammar only','st-s'],x:['Not Ngunnawal','st-x']};
const CATS=['Animals','Body','Family','Country and sky','Plants','Things people make','Actions','Numbers','People words','Other','Places'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('yarn-ngl:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('yarn-ngl:'+k,JSON.stringify(v))}catch(e){}}};

let W=[], POOL=[], LESSONS=[], fav=new Set(store.get('fav',[])), done=store.get('done',{});
let dq={q:'',cat:'All',st:'all',limit:60};
// Kept out of lessons and featured cards (still listed in the dictionary). Assumption: lessons should be safe for general and school use.
const HOLD=/ceremon|initiat|sacred|secret|clever man|ghost|spirit|devil|boogie|haunt|dead|death|die\b|died|corpse|grave|penis|vagina|urine|faec|excrement|bottom|bum\b|pubic|testic|sex|semen|caucasian|white man|white person|whites|blacks|wild black|police|\?/i;

function key(e){return e.w}
function short(e){return e.s||e.g||e.sg}
function plain(w){return w.replace(/\s+\d+$/,'')}

async function boot(){
  try{
    const r=await fetch('words.json'); W=await r.json();
  }catch(e){document.getElementById('view').innerHTML='<div class="empty">Could not load words.json. Open this page through the published link or a local web server, not as a file.</div>';return}
  POOL=W.filter(e=>(e.st==='ok'||e.st==='cv') && !e.nolesson && !/^[-=]/.test(e.w) && !/\s/.test(plain(e.w)) && e.c!=='Places' && !HOLD.test(e.g+' '+e.sg+' '+(e.cm||'')));
  buildLessons();
  document.getElementById('tabs').innerHTML=TABS.map(([id,l,ic])=>`<button data-tab="${id}">${ic}<span>${l}</span></button>`).join('');
  document.getElementById('tabs').onclick=ev=>{const b=ev.target.closest('button');if(b)go(b.dataset.tab)};
  addEventListener('hashchange',route); route();
}
function go(t){ if(location.hash==='#'+t) route(); else location.hash=t; }
function route(){
  const h=(location.hash||'#home').slice(1);
  const t=TABS.find(x=>x[0]===h)?h:'home';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t?'page':'false'));
  ({home:Home,dictionary:Dict,learn:Learn,saved:Saved,about:About})[t]();
  scrollTo(0,0);
}
function setHead(t,info=''){document.getElementById('ttl').textContent=t;document.getElementById('hdrInfo').textContent=info}
function view(html){document.getElementById('view').innerHTML=html}
function dayIndex(n,salt=0){const d=new Date();const k=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return (k*7919+salt)%n}
function favBtn(e){const on=fav.has(key(e));return `<button class="heart" data-fav="${esc(key(e))}" aria-label="${on?'Remove from saved':'Save word'}" aria-pressed="${on}">${on?I.heartFill:I.saved}</button>`}
function pill(e){const [l,c]=ST[e.st];return `<span class="pill ${c}">${l}</span>`}

/* ---------- Home ---------- */
const PHRASES=['yumalundi','dhaguwa yanara','gayali nayung','winanga nimidjaa','djan yimaba','yara 1','marambang galany','ninggi baamir'];
function Home(){
  setHead('');
  const wod=POOL[dayIndex(POOL.length)];
  const ph=PHRASES.map(w=>W.find(e=>e.w===w)).filter(Boolean);
  const p=ph[dayIndex(ph.length,3)];
  const tot=LESSONS.length, fin=LESSONS.filter(l=>done[l.id]).length;
  const next=LESSONS.find(l=>!done[l.id])||LESSONS[0];
  view(`
  <div class="brand"><div class="yarn">YARN</div><div class="lang">Ngunnawal</div><div class="tag">Learn. Read. Practise.</div></div>
  <div class="stack">
    <div class="card"><div class="row"><span class="badge b-gold">${I.sun}</span>
      <div class="grow"><div class="eyebrow">Word of the day</div><div class="word">${esc(plain(wod.w))}</div><div class="gloss">${esc(short(wod))}</div></div>${favBtn(wod)}</div>
      <div class="row" style="justify-content:space-between;margin-top:10px">${pill(wod)}<button class="link" data-open="${esc(wod.w)}">Sources &rsaquo;</button></div></div>
    ${p?`<div class="card"><div class="row"><span class="badge b-ochre">${I.chat}</span>
      <div class="grow"><div class="eyebrow">Useful word</div><div class="word" style="font-size:21px">${esc(plain(p.w))}</div><div class="gloss">${esc(short(p))}</div></div>${favBtn(p)}</div>
      <div class="row" style="justify-content:space-between;margin-top:10px">${pill(p)}<button class="link" data-open="${esc(p.w)}">Sources &rsaquo;</button></div></div>`:''}
    <button class="card" style="text-align:left" data-go="lesson:${next.id}"><div class="row"><span class="badge b-sage">${I.book}</span>
      <div class="grow"><div class="eyebrow">Continue learning</div><div style="font-weight:600">${esc(next.name)}</div>
      <div class="row" style="gap:10px;margin-top:8px"><div class="progress grow"><i style="width:${tot?Math.round(fin/tot*100):0}%"></i></div><span class="count">${fin}/${tot}</span></div></div>${I.chev}</div></button>
    <button class="card" style="text-align:left" data-go="quick"><div class="row"><span class="badge b-plum">${I.quiz}</span>
      <div class="grow"><div class="eyebrow">Quick quiz</div><div style="font-weight:600">10 random words</div><div class="small">From the ${POOL.length} cross-checked words</div></div>${I.chev}</div></button>
    <div class="note"><b>Working version.</b> Every word here comes from the Baird 2022 dictionary or the 2019 sketch grammar. No audio yet. Check meanings and use with Cheyne Halloran before sharing.</div>
  </div>`);
}

/* ---------- Dictionary ---------- */
function Dict(){
  setHead('Dictionary');
  const cats=['All',...CATS.filter(c=>W.some(e=>e.c===c))];
  view(`<div class="stack">
    <label class="search">${I.search}<input id="q" type="search" placeholder="Search Ngunnawal or English" autocomplete="off" value="${esc(dq.q)}" aria-label="Search words"></label>
    <div class="chips" id="cats">${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${dq.cat===c}">${esc(c)}</button>`).join('')}</div>
    <div class="chips" id="sts">${[['all','All sources'],['cv','Checked by Cheyne'],['ok','Both agree'],['chk','Sources differ'],['b','Baird 2022 only'],['s','Sketch only'],['x','Not Ngunnawal']].map(([k,l])=>`<button class="chip" data-st="${k}" aria-pressed="${dq.st===k}">${l}</button>`).join('')}</div>
    <div class="count" id="cnt"></div>
    <div class="list" id="res"></div>
  </div>`);
  const q=document.getElementById('q');
  q.oninput=()=>{dq.q=q.value;dq.limit=60;renderDict()};
  document.getElementById('cats').onclick=ev=>{const b=ev.target.closest('[data-cat]');if(!b)return;dq.cat=b.dataset.cat;dq.limit=60;document.querySelectorAll('#cats .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));renderDict()};
  document.getElementById('sts').onclick=ev=>{const b=ev.target.closest('[data-st]');if(!b)return;dq.st=b.dataset.st;dq.limit=60;document.querySelectorAll('#sts .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));renderDict()};
  renderDict();
}
function fold(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function renderDict(){
  const q=fold(dq.q.trim());
  let r=W.filter(e=>(dq.cat==='All'||e.c===dq.cat)&&(dq.st==='all'||e.st===dq.st));
  if(q){
    const scored=[];
    for(const e of r){const w=fold(e.w),g=fold(e.g+' '+e.sg+' '+(e.cm||''));let s=-1;
      if(w===q||plain(w)===q)s=0;else if(fold(short(e))===q)s=0.5;else if(w.startsWith(q))s=1;else if(new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(g))s=2;else if(w.includes(q))s=3;else if(g.includes(q))s=4;
      if(s>=0)scored.push([s,e])}
    r=scored.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  }
  document.getElementById('cnt').textContent=`${r.length} ${r.length===1?'entry':'entries'}`;
  const shown=r.slice(0,dq.limit);
  document.getElementById('res').innerHTML=shown.length?shown.map(rowHTML).join('')+(r.length>dq.limit?`<button class="item" id="more" style="justify-content:center;color:var(--ochre);font-weight:600">Show more (${r.length-dq.limit} left)</button>`:''):'<div class="empty">No entries match. These lists only hold words from the two sources.</div>';
  const m=document.getElementById('more'); if(m) m.onclick=()=>{dq.limit+=100;renderDict()};
}
function rowHTML(e){return `<button class="item" data-open="${esc(e.w)}"><span class="grow"><span class="w">${esc(e.w)}</span><br><span class="g">${esc(short(e))}</span></span>${e.st!=='ok'?pill(e):''}${fav.has(key(e))?'<span style="color:var(--ochre);width:18px">'+I.heartFill+'</span>':''}</button>`}

/* ---------- Detail sheet ---------- */
function openWord(w){
  const e=W.find(x=>x.w===w); if(!e) return;
  const why={cv:'Meaning checked by Cheyne Halloran, language authority. His meaning is shown first.',x:'Cheyne Halloran says this is not a Ngunnawal word. Kept here only so the record is complete.',ok:'The headword is in both lists and the meanings match.',chk:'The headword is in both lists but the meanings do not line up. Check with Cheyne before using.',b:'Only in the Baird 2022 dictionary. Not in the sketch grammar word list.',s:'Only in the 2019 sketch grammar word list. Not in the Baird 2022 dictionary.'}[e.st];
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.w)}"><div class="grab"></div>
   <div class="row"><div class="grow"><div class="word" style="font-size:30px">${esc(plain(e.w))}</div><div class="gloss" style="font-size:16px">${esc(short(e))}</div></div>${favBtn(e)}<button class="iconbtn" data-close aria-label="Close">${I.close}</button></div>
   <div style="margin-top:10px">${pill(e)}</div><p class="small" style="margin:8px 0 0">${why}</p>
   ${e.cn?`<div class="src"><h3>${{confirmed:'Meaning from',corrected:'Corrected by',question:'Question from',unsure:'Unsure, note from',not_ngunnawal:'Note from'}[e.ct]||'Note from'} ${esc(e.cnby)}</h3>${e.cm?`<div style="font-weight:600">${esc(e.cm)}</div>`:''}<div class="small" style="margin-top:4px;white-space:pre-line">Exact words: &ldquo;${esc(e.cn)}&rdquo;</div>${e.cna?`<div class="small" style="margin-top:4px"><b>Assumption:</b> ${esc(e.cna)}</div>`:''}<div class="small" style="margin-top:4px">Recorded ${esc(e.cnd)}</div></div>`:''}
   ${e.g?`<div class="src"><h3>Baird dictionary 2022</h3><div>${esc(e.g.replace(/ \| /g,' · '))}</div>
     <dl class="kv" style="margin-top:8px">${e.pos?`<dt>Word type</dt><dd>${esc(e.pos)}</dd>`:''}${e.dl?`<dt>Recorded at</dt><dd>${esc(e.dl)}</dd>`:''}${/\s\d+$/.test(e.w)?`<dt>Entry</dt><dd>${esc(e.w)} (same spelling, separate entry)</dd>`:''}</dl>
     ${e.com?`<p class="small" style="margin:8px 0 0">Note in source: ${esc(e.com)}</p>`:''}</div>`:''}
   ${e.sg?`<div class="src"><h3>Sketch grammar 2019, word list</h3><div>${esc(e.sg)}</div><div class="small" style="margin-top:4px">Page ${esc(e.sp)}</div></div>`:''}
   <div class="src small">No audio recording in the source files.</div></div>`;
  document.body.appendChild(bg);
  const close=()=>{bg.remove();document.removeEventListener('keydown',k)};
  const k=ev=>{if(ev.key==='Escape')close()};
  document.addEventListener('keydown',k);
  bg.addEventListener('click',ev=>{if(ev.target===bg||ev.target.closest('[data-close]'))close()});
  bg.querySelector('[data-close]').focus();
}

/* ---------- Learn ---------- */
function buildLessons(){
  LESSONS=[];
  for(const c of CATS){
    const ws=POOL.filter(e=>e.c===c);
    if(ws.length<4) continue;
    const n=Math.ceil(ws.length/10), size=Math.ceil(ws.length/n);
    for(let i=0;i<n;i++){const words=ws.slice(i*size,(i+1)*size); if(words.length<4)continue;
      LESSONS.push({id:c+'-'+(i+1),cat:c,name:n>1?`${c} ${i+1}`:c,words})}
  }
}
function Learn(){
  setHead('Learn',`${LESSONS.filter(l=>done[l.id]).length}/${LESSONS.length} done`);
  const groups=CATS.filter(c=>LESSONS.some(l=>l.cat===c));
  view(`<div class="stack">
    <button class="card" style="text-align:left" data-go="quick"><div class="row"><span class="badge b-plum">${I.quiz}</span><div class="grow"><div style="font-weight:700">Quick quiz</div><div class="small">10 random cross-checked words</div></div>${I.chev}</div></button>
    <button class="card" style="text-align:left" data-go="grammar"><div class="row"><span class="badge b-gold">${I.book}</span><div class="grow"><div style="font-weight:700">How verbs change</div><div class="small">ngubu 'to beat, to hit'. Sketch grammar, Appendix B</div></div>${I.chev}</div></button>
    ${groups.map(c=>`<h2 class="sec">${esc(c)}<span class="count">${POOL.filter(e=>e.c===c).length} words</span></h2>
      <div class="list">${LESSONS.filter(l=>l.cat===c).map(l=>`<button class="item" data-go="lesson:${esc(l.id)}"><span class="grow"><span class="w" style="font-size:15px">${esc(l.name)}</span><br><span class="g">${esc(l.words.slice(0,4).map(e=>plain(e.w)).join(', '))}&hellip;</span></span>${done[l.id]?`<span class="pill st-ok">${done[l.id]}/${l.words.length}</span>`:`<span class="count">${l.words.length} words</span>`}</button>`).join('')}</div>`).join('')}
    <p class="small">Lessons only use words Cheyne has checked or where both sources agree. They leave out ceremony, death and rude words, and anything marked uncertain. Those stay in the dictionary.</p>
  </div>`);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startLesson(id){
  const l=LESSONS.find(x=>x.id===id); if(!l) return go('learn');
  let i=0;
  const study=()=>{
    setHead(l.name,`Word ${i+1} of ${l.words.length}`);
    const e=l.words[i];
    view(`<div class="stack">
      <div class="progress"><i style="width:${(i)/l.words.length*100}%"></i></div>
      <p class="qprompt" style="margin:18px 0 0">Read the word and its meaning</p>
      <div class="card" style="padding:28px 16px;text-align:center"><div class="qword">${esc(plain(e.w))}</div><div class="gloss" style="font-size:18px;margin-top:8px">${esc(short(e))}</div>
        <div style="margin-top:14px">${e.sp?`<span class="small">Sketch grammar p.${esc(e.sp)}</span>`:''}</div></div>
      <div class="row"><button class="btn btn-ghost" id="prev" ${i?'':'disabled style="opacity:.4"'}>Back</button><button class="btn btn-primary grow" id="nxt">${i<l.words.length-1?'Next word':'Start the quiz'}</button></div>
    </div>`);
    document.getElementById('nxt').onclick=()=>{if(i<l.words.length-1){i++;study()}else quiz(l.words,l)};
    document.getElementById('prev').onclick=()=>{if(i){i--;study()}};
  };
  study();
}
function quiz(words,lesson){
  const qs=shuffle(words).map((e,n)=>({e,dir:n%2?'en':'ngl'}));
  let k=0,score=0;
  const pool=POOL;
  const ask=()=>{
    const {e,dir}=qs[k];
    setHead(lesson?lesson.name:'Quick quiz',`${k+1} of ${qs.length}`);
    const same=x=>fold(short(x))===fold(short(e));
    let cands=shuffle((lesson?words:pool).filter(x=>x!==e&&!same(x)));
    if(cands.length<3) cands=cands.concat(shuffle(pool.filter(x=>x.c===e.c&&x!==e&&!same(x)&&!cands.includes(x))));
    const seen=new Set([fold(short(e))]),wrong=[];
    for(const x of cands){const s=fold(short(x));if(!seen.has(s)){seen.add(s);wrong.push(x)}if(wrong.length===3)break}
    const opts=shuffle([e,...wrong]);
    const label=x=>dir==='ngl'?short(x):plain(x.w);
    view(`<div class="stack">
      <div class="progress"><i style="width:${k/qs.length*100}%"></i></div>
      <p class="qprompt" style="margin:18px 0 0">${dir==='ngl'?'What does this word mean?':'Which Ngunnawal word means this?'}</p>
      <div class="card" style="padding:26px 16px"><div class="qword" style="${dir==='en'?'font-size:26px':''}">${esc(dir==='ngl'?plain(e.w):short(e))}</div></div>
      <div class="opts" id="opts">${opts.map((x,n)=>`<button class="opt" data-n="${n}">${esc(label(x))}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`);
    document.getElementById('opts').onclick=ev=>{
      const b=ev.target.closest('.opt'); if(!b||b.disabled) return;
      const pick=opts[+b.dataset.n], ok=pick===e;
      if(ok) score++;
      document.querySelectorAll('.opt').forEach((o,n)=>{o.disabled=true;if(opts[n]===e)o.classList.add('right')});
      if(!ok) b.classList.add('wrong');
      document.getElementById('fb').innerHTML=`<div class="card" style="margin-top:2px"><div class="row"><div class="grow"><div style="font-weight:700">${ok?'Correct':'Not quite'}</div><div class="small">${esc(plain(e.w))} = ${esc(short(e))}</div></div><button class="link" data-open="${esc(e.w)}">Sources &rsaquo;</button></div></div>
        <button class="btn btn-sage btn-block" id="cont" style="margin-top:12px">${k<qs.length-1?'Continue':'See result'}</button>`;
      document.getElementById('cont').onclick=()=>{k++; k<qs.length?ask():result()};
    };
  };
  const result=()=>{
    if(lesson){done[lesson.id]=Math.max(done[lesson.id]||0,score);store.set('done',done)}
    const nxt=lesson?LESSONS[LESSONS.indexOf(lesson)+1]:null;
    setHead(lesson?lesson.name:'Quick quiz','Finished');
    view(`<div class="stack" style="padding-top:20px">
      <div class="card" style="text-align:center;padding:28px 16px"><div class="eyebrow">Your score</div><div class="qword" style="margin-top:6px">${score} / ${qs.length}</div>
      <p class="small" style="margin:10px 0 0">${score===qs.length?'Every answer right.':'Go through the words again, then retry.'}</p></div>
      <button class="btn btn-primary btn-block" data-go="${lesson?'lesson:'+esc(lesson.id):'quick'}">${lesson?'Do this lesson again':'Another quick quiz'}</button>
      ${nxt?`<button class="btn btn-ghost btn-block" data-go="lesson:${esc(nxt.id)}">Next lesson: ${esc(nxt.name)}</button>`:''}
      <button class="btn btn-block" data-go="learn">All lessons</button>
    </div>`);
  };
  ask();
}
const PARA=[
 ['ngubumangga','I beat'],['ngubumandji','thou beatest'],['ngubumany','he beats'],
 ['ngubumanga','we two (incl.) beat'],['ngubumangalu','we two (excl.) beat'],['ngubumanbu','you two beat'],['ngubumanbula','those two beat'],
 ['ngubumanyin','we (incl) beat'],['ngubumanyila','we (excl) beat'],['ngubumanhu','you beat'],['ngubumandjula','they beat']];
const TENSE=[
 ['ngubumangga','ngubu-ma-ngga','I beat','present, p.88'],
 ['nguburingga','ngubu-ri-ngga','I beat, indefinite past','p.87'],
 ['ngubumuwingga','ngubu-muwi-ngga','I beat recently','p.88'],
 ['nguburiyangga','ngubu-riya-ngga','I beat long ago','p.88'],
 ['ngubuningga','ngubu-ni-ngga','I will beat, indefinite','p.90'],
 ['ngubumuningga','ngubu-muni-ngga','I will beat soon','p.90']];
function Grammar(){
  setHead('How verbs change');
  view(`<div class="stack">
   <button class="row link" data-go="learn" style="gap:4px;width:fit-content"><span style="width:18px;display:inline-grid">${I.back}</span>Learn</button>
   <div class="card prose"><p>The sketch grammar sets out the verb <b>ngubu</b> 'to beat, to hit' from Mathews (1904). Endings on the verb show who does it and when.</p><p class="small">Glosses follow the sketch grammar, Appendix B, pages 87 to 90. Old English such as 'thou' is kept as written.</p></div>
   <h2 class="sec">Who does it (present tense)</h2>
   <div class="card" style="padding:6px 12px"><table class="tbl"><tbody>${PARA.map(([w,g])=>`<tr><td>${w}</td><td>${g}</td></tr>`).join('')}</tbody></table></div>
   <p class="small">incl. = including the person you are talking to. excl. = not including them.</p>
   <h2 class="sec">When it happens (I)</h2>
   <div class="card" style="padding:6px 12px"><table class="tbl"><tbody>${TENSE.map(([w,b,g,p])=>`<tr><td>${w}<div class="small" style="font-weight:400">${b}</div></td><td>${g}<div class="small">${p}</div></td></tr>`).join('')}</tbody></table></div>
  </div>`);
}

/* ---------- Saved ---------- */
function Saved(){
  const list=W.filter(e=>fav.has(key(e)));
  setHead('Saved words',list.length?`${list.length}`:'');
  view(`<div class="stack">${list.length?`<div class="list">${list.map(rowHTML).join('')}</div>
    ${list.filter(e=>POOL.includes(e)).length>=4?`<button class="btn btn-primary btn-block" data-go="savedquiz">Quiz my saved words</button>`:''}`
    :`<div class="card empty">Tap the heart on any word to keep it here. Saved words stay on this phone only.</div>`}</div>`);
}

/* ---------- About ---------- */
function About(){
  const c=k=>W.filter(e=>e.st===k).length;
  setHead('About these words');
  view(`<div class="stack">
   <div class="card prose">
    <p>This app uses two sources from the Grounded Systems language repository. No other words are used.</p>
    <dl class="kv"><dt>Dictionary</dt><dd>Louise Baird, Ngunnawal XML dictionary, 4 October 2022</dd><dt>Grammar</dt><dd>Louise Baird, A Sketch Grammar of Ngunnawal, AIATSIS, 2019. Word list, Appendix C 17.3, pages 117 to 139</dd></dl>
   </div>
   <h2 class="sec">How each word is marked</h2>
   <div class="list">
    ${['cv','ok','chk','b','s','x'].map(k=>`<div class="item"><span class="grow">${pill({st:k})}<br><span class="g" style="white-space:normal">${{cv:'Meaning checked by Cheyne Halloran. Lessons use these and the next group.',x:'Cheyne says this is not a Ngunnawal word. Never used in lessons.',ok:'Same spelling and matching meaning in both sources.',chk:'Same spelling, but the meanings do not line up. Needs checking.',b:'Only in the 2022 dictionary.',s:'Only in the sketch grammar word list.'}[k]}</span></span><span class="count">${c(k)}</span></div>`).join('')}
   </div>
   <div class="note"><b>Language authority: Cheyne Halloran.</b> This is a working tool built from source documents. Meanings have not yet been checked with community. Do not share outside Grounded Systems without permission.</div>
   <div class="card prose small">
    <p>Not included: 15 personal names from the dictionary, audio (none in the source files) and pictures.</p>
    <p>Word groups such as Animals or Body are sorted from the English meanings only, so some words land in Other.</p>
    <p>Spellings follow each source as written, including spelling slips in the English.</p>
   </div>
   <button class="btn btn-ghost btn-block" id="reset">Clear my saved words and progress</button>
  </div>`);
  document.getElementById('reset').onclick=ev=>{const b=ev.currentTarget;if(b.dataset.sure){fav=new Set();done={};store.set('fav',[]);store.set('done',{});flash('Cleared');About()}else{b.dataset.sure=1;b.textContent='Tap again to clear'}};
}
function flash(t){const f=document.createElement('div');f.className='flash';f.textContent=t;document.body.appendChild(f);setTimeout(()=>f.remove(),1600)}

/* ---------- global clicks ---------- */
document.addEventListener('click',ev=>{
  const f=ev.target.closest('[data-fav]');
  if(f){ev.stopPropagation();const k=f.dataset.fav;fav.has(k)?fav.delete(k):fav.add(k);store.set('fav',[...fav]);
    const on=fav.has(k);document.querySelectorAll(`[data-fav="${CSS.escape(k)}"]`).forEach(b=>{b.innerHTML=on?I.heartFill:I.saved;b.setAttribute('aria-pressed',on)});flash(on?'Saved':'Removed');return}
  const o=ev.target.closest('[data-open]'); if(o){openWord(o.dataset.open);return}
  const g=ev.target.closest('[data-go]'); if(g){const d=g.dataset.go;
    if(d.startsWith('lesson:')) startLesson(d.slice(7));
    else if(d==='quick') quiz(shuffle(POOL).slice(0,10),null);
    else if(d==='savedquiz') quiz(shuffle(POOL.filter(e=>fav.has(key(e)))).slice(0,10),null);
    else if(d==='grammar') Grammar();
    else go(d);
    scrollTo(0,0);}
},true);
boot();
})();
</script>
